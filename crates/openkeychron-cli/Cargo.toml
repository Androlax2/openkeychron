[package]
name = "openkeychron-cli"
description = "openkeychron command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
openkeychron-guard = { path = "../openkeychron-guard", version = "0.0.0" }
openkeychron-hid.workspace = true
openkeychron-keychron = { path = "../openkeychron-keychron", version = "0.0.0" }
openkeychron-via = { path = "../openkeychron-via", version = "0.0.0" }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "openkeychron"
path = "src/main.rs"

[lints]
workspace = true
