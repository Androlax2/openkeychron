# cargo-deny: advisories, licences and dependency sources.
# Run: cargo deny --config .cargo/deny.toml check

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, no known vulnerability, build-time only. Chain: proc-macro-error 1.0.4
    # <- glib-macros 0.18 <- gtk-rs GTK3 bindings (gtk, webkit2gtk) <- tauri, tao, wry
    # <- openkeychron-app, on Linux. No fix until Tauri drops GTK3; remove with #117.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro-error via Tauri's GTK3 bindings; remove with #117" },
]

[licenses]
# Additions here need a conscious decision; keep the list to what the graph pulls in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]

[licenses.private]
# Workspace crates are `publish = false`; they are ours, not third-party code.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
