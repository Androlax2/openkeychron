# Hand-written, not recorded: what `openkeychron rgb key --backup FILE A 0 255` reads on a V5 Max
# over cable before it saves its backup: the first ten events of cli-rgb-key.toml (feature bit,
# protocol, LED count, LED under 2,1, its colour) and no write. A test whose backup cannot be
# saved replays it, so a write sent before the backup fails the replay.
# Bytes follow keyboards/keychron/common/rgb/keychron_rgb.c at Keychron/qmk_firmware 2b493ff9.
format_version = 1

[device]
name = "Keychron V5 Max"
vendor_id = 0x3434
