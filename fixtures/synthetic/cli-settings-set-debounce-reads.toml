# Hand-written, not recorded: the reads `openkeychron settings set ... debounce` sends before it
# saves its backup, and nothing after. Any write before the backup is saved fails the replay.
# Bytes follow docs/protocol/keychron.md; copied from cli-settings-get.toml.
format_version = 1

[device]
name = "Keychron V5 Max"
vendor_id = 0x3434
product_id = 0x0951
usage_page = 0xff60
usage = 0x61

[[event]]
kind = "write"
data = "a7 01 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "read"
data = "a7 01 00 02 00 fe 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "write"
data = "a7 05 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
