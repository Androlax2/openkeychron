# Hand-written, not recorded: the reads `openkeychron rgb mixed region --backup FILE 1 A 4,0`
# makes on a V5 Max over cable before its backup: the checks and layout (0xa2, a8 01, a8 05,
# a8 0b), the firmware build (0xa0, 0xa1 "v1.1.0 2025-03-17-10:00:00"), the whole mixed state
# (a8 0c, a8 0e) and the LEDs of rows 2 and 4 (a8 06). No write follows, so a command that went on
# to write would fail the replay.
# Bytes follow keyboards/keychron/common/rgb/keychron_rgb.c and keychron_raw_hid.c at
# Keychron/qmk_firmware 2b493ff9.
# LED numbers and the region map are made up: every key but the knob gets the next LED in the
# built-in layout's order, and the top row starts in region 1. Effect lists are the firmware
# defaults. Real recordings need the cable session (#20).
format_version = 1

