# Hand-written, not recorded: the start of every `openkeychron rgb mixed` write on a V5 Max
# over cable: the Keychron RGB checks (0xa2, a8 01), the LED count (a8 05) and the region layout
# (a8 0b), then nothing. A command that refuses its arguments against that layout must stop here.
# Bytes follow keyboards/keychron/common/rgb/keychron_rgb.c at Keychron/qmk_firmware 2b493ff9.
# LED numbers and the region map are made up: every key but the knob gets the next LED in the
# built-in layout's order, and the top row starts in region 1. Effect lists are the firmware
# defaults. Real recordings need the cable session (#20).
format_version = 1

[device]
name = "Keychron V5 Max"
vendor_id = 0x3434
product_id = 0x0951
usage_page = 0xff60
usage = 0x61

[[event]]
kind = "write"
data = "a2 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "read"
data = "a2 00 f7 03 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "write"
data = "a8 01 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "read"
data = "a8 01 00 01 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "write"
data = "a8 05 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "read"
data = "a8 05 00 62 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "write"
data = "a8 0b 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "read"
data = "a8 0b 00 02 05 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
