# Hand-written, not recorded: `openkeychron rgb mixed get` on a V5 Max over cable: checks the
# Keychron RGB feature bit (0xa2) and protocol (a8 01), reads the LED count (a8 05, 98) and the
# region layout (a8 0b, 2 regions of 5 slots), every LED's region (a8 0c), both effect lists
# (a8 0e), then the LEDs of each matrix row (a8 06). Only reads.
# Bytes follow keyboards/keychron/common/rgb/keychron_rgb.c at Keychron/qmk_firmware 2b493ff9.
# LED numbers and the region map are made up: every key but the knob gets the next LED in the
# built-in layout's order, and the top row starts in region 1. Effect lists are the firmware
# defaults. Real recordings need the cable session (#20).
format_version = 1

[device]
name = "Keychron V5 Max"
vendor_id = 0x3434
product_id = 0x0951
usage_page = 0xff60
usage = 0x61

