# Hand-written, not recorded: `openkeychron rgb key` on a V5 Max whose firmware predates per-key
# RGB: the 0xa2 feature bits lack bit 7 (Keychron RGB), so nothing else is sent.
# Bytes follow keyboards/keychron/common/keychron_raw_hid.c at Keychron/qmk_firmware 2b493ff9.
format_version = 1

[device]
name = "Keychron V5 Max"
vendor_id = 0x3434
product_id = 0x0951
usage_page = 0xff60
usage = 0x61

[[event]]
kind = "write"
data = "a2 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

[[event]]
kind = "read"
data = "a2 00 77 03 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"
