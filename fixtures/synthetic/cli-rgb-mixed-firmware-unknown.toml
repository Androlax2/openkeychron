# Hand-written, not recorded: the start of an `openkeychron rgb mixed` write on a V5 Max over
# cable whose firmware answers 0xa0 with Keychron protocol version 3, a version whose 0xa1
# layout has not been read: the Keychron RGB checks (0xa2, a8 01), the LED count (a8 05), the region layout
# (a8 0b) and 0xa0, then nothing. A write must refuse before reading the mixed state.
# Bytes follow keyboards/keychron/common/rgb/keychron_rgb.c and keychron_raw_hid.c at
# Keychron/qmk_firmware 2b493ff9. Real recordings need the cable session (#20).
format_version = 1

[device]
name = "Keychron V5 Max"
vendor_id = 0x3434
product_id = 0x0951
usage_page = 0xff60
usage = 0x61

