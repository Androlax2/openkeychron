# Hand-written, not recorded: `openkeychron rgb key --backup FILE A 0 255` on a V5 Max over
# cable: checks the Keychron RGB feature bit (0xa2) and protocol (a8 01), reads the LED count
# (a8 05, 98), looks up the LED under matrix 2,1 (a8 06; LED 38 is made up), reads its colour
# (hue 170), sets hue 0 keeping value 255 (a8 0a), reads it back, then saves (a8 02).
# Bytes follow keyboards/keychron/common/rgb/keychron_rgb.c at Keychron/qmk_firmware 2b493ff9.
# Real recordings need the cable session (#20).
