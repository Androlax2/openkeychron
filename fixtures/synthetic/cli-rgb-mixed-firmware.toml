# Hand-written, not recorded: the start of every `openkeychron rgb mixed` write on a V5 Max
# over cable, up to the firmware build: the Keychron RGB checks (0xa2, a8 01), the LED count
# (a8 05), the region layout (a8 0b), then the Keychron protocol (0xa0) and firmware version
# (0xa1, "v1.1.0 2025-03-17-10:00:00"), then nothing. A restore that refuses the backup's
# firmware build must stop here.
# Bytes follow keyboards/keychron/common/rgb/keychron_rgb.c and keychron_raw_hid.c at
# Keychron/qmk_firmware 2b493ff9. Real recordings need the cable session (#20).
format_version = 1

[device]
name = "Keychron V5 Max"
vendor_id = 0x3434
product_id = 0x0951
