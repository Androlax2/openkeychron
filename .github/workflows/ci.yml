name: CI

# Each job runs one `make` target; `make ci` reproduces the whole run locally.
# Changing a `run:` here without changing the Makefile is a bug.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fmt, clippy, test, doc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.target != 'fmt'
      # The Tauri app (app/src-tauri) links WebKitGTK on Linux.
      - name: Install WebKitGTK
        if: matrix.target != 'fmt'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      # fmt and clippy also run Biome and svelte-check on app/; same Node and pnpm as local.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.target == 'fmt' || matrix.target == 'clippy'
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.target == 'fmt' || matrix.target == 'clippy'
        with:
          node-version: 26.13.0
      - name: Install app dependencies
        if: matrix.target == 'fmt' || matrix.target == 'clippy'
        run: pnpm --dir app install --frozen-lockfile
      - run: make ${{ matrix.target }}

  tools:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [typos, deny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same versions as the local tools, so a local pass means a CI pass.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: typos@1.51.1,cargo-deny@0.20.2
      - run: make ${{ matrix.target }}
