name: Task
description: A piece of planned work, in the same shape as every roadmap issue.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this achieves and why, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The checklist that makes this issue finished.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: The exact command or steps that prove it works.
    validations:
      required: true
  - type: textarea
    id: blocked-by
    attributes:
      label: Blocked by
      description: Issues that must close first, as `#N`. Write "Nothing" if none.
      value: Nothing. Ready to start.
    validations:
      required: true
